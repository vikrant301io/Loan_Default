# Model-specific hyperparameters

models:
  LogisticRegression:
    C: 0.1
    max_iter: 1000
    class_weight: "balanced"
    solver: "lbfgs"
    
  RandomForest:
    n_estimators: 200
    max_depth: 15
    min_samples_split: 10
    min_samples_leaf: 4
    class_weight: "balanced"
    n_jobs: -1
    
  GradientBoosting:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 5
    subsample: 0.8
    
  XGBoost:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 3
    subsample: 0.8
    colsample_bytree: 0.8
    eval_metric: "logloss"
    scale_pos_weight: 1
    
  LightGBM:
    n_estimators: 200
    learning_rate: 0.05
    max_depth: 6
    num_leaves: 31
    class_weight: "balanced"
    verbose: -1

